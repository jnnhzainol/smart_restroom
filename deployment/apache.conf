ServerName localhost
<Directory /var/www/html>
    Options -Indexes
    <FilesMatch "^(config\.php|create_admin\.php|\..*|.*\.(sql|md|json|toml))$">
        Require all denied
    </FilesMatch>
</Directory>
<DirectoryMatch "^/var/www/html/(deployment|includes|\.git|\.codex|\.agents)">
    Require all denied
</DirectoryMatch>
